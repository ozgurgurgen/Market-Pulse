<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MarketPulse AI - TEFAS Fonları, Borsa & Backtest Radar</title>
    
    <!-- PWA Anti-Loop / Service Worker Clean Script -->
    <script>
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            }).catch(function() {});
          }
        } catch (err) {
          console.warn('Cache cleanup notice:', err);
        }
      })();
    </script>
    <meta name="description" content="Halka Arz (IPO) Takip & İstihbarat Merkezi, Finansal İstihbarat (4-Agent Intelligence Hub), TEFAS Fonları, Canlı BIST/ABD/Kripto/Emtia analizi, Enflasyon üstü getiri radarı ve Portföy Backtest motoru." />
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0f17" />
    
    <style>
      html, body {
        background-color: #0b0f17 !important;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        background-color: #0b0f17;
      }
    </style>
    
    <!-- Apple iOS PWA Support -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarketPulse" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="MarketPulse AI - TEFAS Fonları, Borsa & Backtest Radar" />
    <meta property="og:description" content="Halka Arz (IPO) Takip & İstihbarat Merkezi, Finansal İstihbarat (4-Agent Intelligence Hub), TEFAS Fonları, Canlı BIST/ABD/Kripto/Emtia analizi, Enflasyon üstü getiri radarı ve Portföy Backtest motoru." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0b0f17] text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root">
      <!-- Pre-mount loading state displayed instantly while JavaScript bundles load -->
      <div id="mp-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f17; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center;">
        <div style="position: relative; width: 56px; height: 56px; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border: 3px solid #1e293b; border-top-color: #10b981; border-radius: 50%; animation: mp-spin 0.9s linear infinite;"></div>
          <div style="position: absolute; inset: 6px; border: 2px solid transparent; border-bottom-color: #06b6d4; border-radius: 50%; animation: mp-spin 1.4s linear infinite reverse;"></div>
        </div>
        <div style="font-size: 18px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; margin-bottom: 6px;">
          MarketPulse AI
        </div>
        <div id="mp-loading-status" style="font-size: 13px; color: #64748b; max-width: 320px; line-height: 1.5;">
          Canlı Piyasa ve TEFAS Fon Motoru Başlatılıyor...
        </div>
        
        <!-- Fallback if bundle loading takes longer than expected -->
        <div id="mp-slow-fallback" style="display: none; margin-top: 24px; padding: 14px 20px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; max-width: 360px;">
          <p style="font-size: 12px; color: #94a3b8; margin: 0 0 12px 0;">Yükleme beklenenden uzun sürüyor. Önbelleği temizleyerek yeniden başlatabilirsiniz:</p>
          <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true);" style="background: #10b981; color: #022c22; font-weight: 600; font-size: 12px; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">
            Önbelleği Temizle & Yenile
          </button>
        </div>
      </div>
    </div>

    <style>
      @keyframes mp-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <script>
      setTimeout(function() {
        var preloader = document.getElementById('mp-preloader');
        var fallback = document.getElementById('mp-slow-fallback');
        if (preloader && fallback) {
          fallback.style.display = 'block';
        }
      }, 15000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
